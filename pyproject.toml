[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scdata"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["numpy>=1.26", "pandas>=2.2", "psycopg[binary]>=3.2", "pika>=1.3", "boto3>=1.35", "prometheus-client>=0.21"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.7", "httpx>=0.27"]
forecast = ["xgboost>=2.1"]
service = ["fastapi>=0.115", "uvicorn>=0.32", "psycopg-pool>=3.2"]

[project.scripts]
scgen = "pipeline.generator:main"
scetl = "pipeline.etl:main"
scforecast = "pipeline.forecast.cli:main"

[tool.setuptools.packages.find]
include = ["pipeline*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["integration: requires TEST_DATABASE_URL and a migrated PostgreSQL database"]
