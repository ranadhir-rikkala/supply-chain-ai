name: supply-chain-ai

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-supplychain}
      POSTGRES_USER: ${POSTGRES_USER:-supplychain}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-supplychain}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  flyway:
    image: flyway/flyway:10-alpine
    command: -connectRetries=60 -outOfOrder=true migrate
    environment:
      FLYWAY_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-supplychain}
      FLYWAY_USER: ${POSTGRES_USER:-supplychain}
      FLYWAY_PASSWORD: ${POSTGRES_PASSWORD:-supplychain}
      FLYWAY_LOCATIONS: filesystem:/flyway/sql
      FLYWAY_PLACEHOLDERS_FORECAST_DB_PASSWORD: ${FORECAST_DB_PASSWORD:-forecast-local-only}
    volumes:
      - ./db/migrations:/flyway/sql:ro
    depends_on:
      postgres:
        condition: service_healthy

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-supplychain}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-supplychain}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  etl-worker:
    build:
      context: .
      dockerfile: infra/etl/Dockerfile
    command: ["scetl", "worker", "--root", "/data"]
    environment:
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-supplychain}:${RABBITMQ_PASSWORD:-supplychain}@rabbitmq:5672/
      METRICS_PORT: 9100
      DATABASE_URL: postgresql://${POSTGRES_USER:-supplychain}:${POSTGRES_PASSWORD:-supplychain}@postgres:5432/${POSTGRES_DB:-supplychain}
    volumes:
      - ${DATA_ROOT:-./data}:/data
    depends_on:
      rabbitmq:
        condition: service_healthy
      flyway:
        condition: service_completed_successfully
    deploy:
      replicas: 2

  caddy:
    build: ./dashboard
    image: supply-chain-ai/caddy:dev
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
    ports:
      - "${CADDY_BIND:-127.0.0.1}:80:80"
      - "${CADDY_BIND:-127.0.0.1}:443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

  forecast-api:
    build:
      context: .
      dockerfile: infra/forecast/Dockerfile
    image: supply-chain-ai/forecast:dev
    command: ["scforecast", "serve", "--port", "8000"]
    environment: &forecast-environment
      DATABASE_URL: postgresql://forecast_service:${FORECAST_DB_PASSWORD:-forecast-local-only}@postgres:5432/${POSTGRES_DB:-supplychain}
      AMQP_URL: amqp://${RABBITMQ_USER:-supplychain}:${RABBITMQ_PASSWORD:-supplychain}@rabbitmq:5672/
      FORECAST_SERVICE_TOKEN: ${FORECAST_SERVICE_TOKEN:-}
      STORE: ${STORE:-local}
      LOCAL_STORE_ROOT: /data
      S3_BUCKET: ${S3_BUCKET:-}
      AWS_REGION: ${AWS_REGION:-us-east-2}
      SERVICE_NAME: forecast-api
    ports:
      - "127.0.0.1:8001:8000"
    volumes:
      - ${DATA_ROOT:-./data}:/data:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
    depends_on:
      flyway:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    restart: unless-stopped
  forecast-worker:
    image: supply-chain-ai/forecast:dev
    command: ["scforecast", "worker"]
    environment:
      <<: *forecast-environment
      SERVICE_NAME: forecast-worker
      METRICS_PORT: 9100
    volumes:
      - ${DATA_ROOT:-./data}:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9100/metrics', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
    depends_on:
      forecast-api:
        condition: service_started
      flyway:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    restart: unless-stopped
volumes:
  postgres_data:
  rabbitmq_data:
  caddy_data:
  caddy_config:
